name: "Check File Changes"

on:
    workflow_call:
        outputs:
            server:
                description: "Whether Unbound server files changed"
                value: ${{ jobs.changes.outputs.server }}
            web:
                description: "Whether Unbound web files changed"
                value: ${{ jobs.changes.outputs.web }}

permissions:
    contents: read
    pull-requests: read 

jobs:
    changes:
        name: "Check File Changes"
        runs-on: ubuntu-latest

        outputs:
            server: ${{ steps.filter.outputs.server }}
            web: ${{ steps.filter.outputs.web }}

        steps:
            - name: "Checkout"
              uses: actions/checkout@v4

            - name: "Check file changes"
              uses: dorny/paths-filter@v4
              id: filter
              with:
                  filters: |
                      server:
                          - "apps/server/**"
                          - "packages/types/**"
                          - "pnpm-lock.yaml"
                          - "pnpm-workspace.yaml"
                      web:
                          - "apps/web/**"
                          - "packages/types/**"
                          - "pnpm-lock.yaml"
                          - "pnpm-workspace.yaml"
