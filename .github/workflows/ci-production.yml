name: "CI: Production"

on:
    workflow_dispatch:
    push:
        branches:
            - master

permissions:
    contents: read

jobs:
    changes:
        uses: ./.github/workflows/check-changes.yml

    build-unbound:
        name: "Build: Unbound App"
        needs: changes
        if: ${{ needs.changes.outputs.server == 'true' || needs.changes.outputs.web == 'true' }}
        runs-on: ubuntu-latest
        environment:
            name: production

        steps:
            - name: "Checkout"
              uses: actions/checkout@v4

            - name: "Setup environment"
              uses: ./.github/actions/setup

            - name: "Build web CSS"
              working-directory: apps/web
              run: pnpm run build

            - name: "Deploy to Cloudflare"
              working-directory: apps/server
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_SECRET }}
              run: pnpm run deploy
